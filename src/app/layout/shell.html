<a class="skip" href="#main">Skip to content</a>

<div class="shell">
  <aside class="sign" [class.open]="menuOpen()">
    <div class="sign-top">
      <a routerLink="/dashboard" class="brand" aria-label="Roleveya dashboard">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M5 22.5h22" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <circle cx="7.5" cy="22.5" r="3" fill="#1f4fa3" stroke="#fff" stroke-width="2" />
          <circle cx="24" cy="22.5" r="3.6" fill="#f2a900" stroke="#fff" stroke-width="2" />
          <path d="M10 17V7.5h4.6a3.3 3.3 0 0 1 0 6.6H10m4.6 0L19 17" fill="none" stroke="#fff" stroke-width="2.3"
            stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Roleveya</span>
      </a>
      <button
        type="button"
        class="menu-toggle"
        (click)="menuOpen.set(!menuOpen())"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="primary-nav"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
      </button>
    </div>

    <div class="sign-body" id="primary-nav">
      <a routerLink="/jobs/new" class="add-job">
        <app-icon name="plus" [size]="18" />
        Add a job
      </a>

      <nav aria-label="Main">
        <ul>
          @for (item of nav; track item.path) {
            <li>
              <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
                <app-icon [name]="item.icon" />
                {{ item.label }}
              </a>
            </li>
          }
        </ul>
      </nav>

      <div class="account">
        <p class="who">
          <strong>{{ auth.user()?.full_name || 'Your account' }}</strong>
          <span>{{ auth.user()?.email }}</span>
        </p>
        <button type="button" class="sign-out" (click)="signOut()" [disabled]="signingOut()">
          <app-icon name="logout" [size]="18" />
          Sign out
        </button>
      </div>
    </div>
  </aside>

  <main id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>
